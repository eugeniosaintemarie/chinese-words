<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" http-equiv="Content-Type"
    content="text/html; charset=UTF-8, width=device-width, initial-scale=1.0" />
  <title>中文维基百科</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇭🇰</text></svg>" />
  <link href="http://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Roboto", sans-serif;
      font-size: 18px;
      background-color: #000000;
      color: #212121;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    span {
      font-size: 3vw;
      font-style: italic;
      height: 30px;
      display: inline-block;
      color: #212121;
    }
    .word-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
    }
    .chinese-char {
      margin-bottom: 10px;
    }
    .pinyin {
      margin-bottom: 10px;
      color: #F5F5F5;
      font-size: 5vw;
    }
    .meaning {
      height: 30px;
      opacity: 0;
      color: #F5F5F5;
      transition: opacity 0.3s ease;
      text-align: center;
    }
    .meaning.visible {
      opacity: 1;
    }
    @media screen and (min-width: 1000px) {
      .main {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 5%;
        width: 100%;
      }
      .action {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-top: 20px;
      }
      h1,
      p {
        font-size: 3vw !important;
      }
      span {
        font-size: 1.5vw !important;
      }
    }
    span {
      font-size: 5vw;
      min-height: 30px;
      display: inline-block;
    }
    .action {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      position: fixed;
      bottom: 25px;
      left: 0;
      z-index: 2;
    }
    .main {
      position: relative;
      height: 100vh;
      width: 100%;
    }
    #word {
      font-size: 8vw;
      word-break: break-all;
      text-align: center;
    }
    #button1,
    #button2 {
      font-size: 50px;
      border: none;
      background: none;
      margin: 0 10px;
      color: #F44336;
      cursor: pointer;
    }
    h1 {
      color: #F5F5F5;
    }
  </style>
</head>
<body>
  <section>
    <div class="main">
      <div id="word" class="word-container"></div>
    </div>
    <div class="action">
      <p id="button1"></p>
      <button id="button1" onclick="random()"><i class="fa-solid fa-square-caret-right"></i></button>
      <button id="button2" onclick="toggleSpanElements()"><i class="fas fa-eye"></i></button>
    </div>
  </section>

    function toggleSpanElements() {
      var meanings = document.querySelectorAll(".meaning");
      meanings.forEach(function(meaning) {
